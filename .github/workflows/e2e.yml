#
# One-shot diagnostic on an isolated branch, not a production CI change.
# The fixed cohort is three original-fixture controls, six diagnostic untraced
# and three diagnostic traced full suites. Every result remains without retries.
# Original controls sanitize the wrapper before scratch/KWin startup. This can
# shift global timing, but adds no observer between KWin readiness and fixture.

name: Native focus diagnostic

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-focus-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Native focus diagnostic (3 original + 6 off + 3 on)
    if: github.ref == 'refs/heads/isac322/native-focus-probe-39904941810'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Resolve the original native image
        id: image
        env:
          IMAGE: ghcr.io/isac322/krema-ci:ctest-fedora-43-079cb5b8d969
        run: |
          set -euo pipefail
          mkdir -p test-results
          # The failing native runner had four CPUs; do not silently substitute
          # a different scheduler workload.
          test "$(nproc)" -eq 4
          docker pull "$IMAGE"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          test "${digest#ghcr.io/isac322/krema-ci@sha256:}" != "$digest"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Build original controls then execute the diagnostic cohort
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DIAGNOSTIC_COMMIT: ${{ github.sha }}
          CID_FILE: ${{ runner.temp }}/native-focus-container.id
          RESOURCE_LEDGER: ${{ runner.temp }}/native-focus-cleanup-ledger.json
          CONTAINER_NAME: native-focus-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Record the exact unique container name before creating the resource.
          python3 - "$RESOURCE_LEDGER" "$CONTAINER_NAME" <<'PY'
          import datetime, json, pathlib, sys
          record = {"kind": "docker-container", "identifier": sys.argv[2],
                    "delete_command": "docker rm " + sys.argv[2], "automatic_removal": True,
                    "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(record, indent=2) + "\n")
          PY
          # Public image: no registry login and no GitHub/registry credentials
          # enter Docker. /src is immutable; the runner copies it to /work,
          # excluding either file- or directory-form .git and the host cache.
          docker run --rm --cpus=4 --ulimit core=0 --name "$CONTAINER_NAME" --cidfile "$CID_FILE" \
            -v "$PWD:/src:ro" -v "$PWD/test-results:/results" \
            -e HOST_UID="$(id -u)" \
            -e CCACHE_DIR=/tmp/ccache -e CCACHE_MAXSIZE=500M \
            -e KREMA_IMAGE_DIGEST="$IMAGE_DIGEST" \
            -e KREMA_DIAGNOSTIC_COMMIT="$DIAGNOSTIC_COMMIT" \
            "$IMAGE_DIGEST" sh -euc '
              umask 022
              trap "chown -R $HOST_UID /results" EXIT
              python3 /src/.github/diagnostics/run_native_focus.py \
                --source /src --work /work --build /tmp/build --results /results \
                --baseline-runs 3 --off-runs 6 --on-runs 3
            '

      - name: Preserve the native container resource record
        if: always()
        env:
          CID_FILE: ${{ runner.temp }}/native-focus-container.id
          RESOURCE_LEDGER: ${{ runner.temp }}/native-focus-cleanup-ledger.json
        run: |
          python3 - "$RESOURCE_LEDGER" "$CID_FILE" <<'PY'
          import json, pathlib, re, sys
          ledger, cidfile = map(pathlib.Path, sys.argv[1:])
          if ledger.exists():
              record = json.loads(ledger.read_text())
              if cidfile.exists():
                  identifier = cidfile.read_text().strip()
                  if re.fullmatch(r"[0-9a-f]{64}", identifier):
                      record["container_id"] = identifier
              output = pathlib.Path("test-results")
              output.mkdir(exist_ok=True)
              (output / "container.resource.summary.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Report sanitized JUnit outcomes
        if: always()
        run: |
          python3 .github/scripts/junit-summary.py \
            "Native focus diagnostic — fixed 3 original + 6 off + 3 on cohort" \
            test-results/*.junit.xml >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-focus-diagnostic-${{ github.run_id }}
          # No build tree, raw runtime JUnit, runtime console or compositor logs.
          path: |
            test-results/*.summary.json
            test-results/*.trace.log
            test-results/*.junit.xml
            test-results/configure.log
            test-results/build.log
            test-results/diagnostic-build.log
            test-results/*.scheduler.txt
          if-no-files-found: warn
